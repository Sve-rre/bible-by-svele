<title>Verse of the day</title>
<h1>Verse of the day</h1>
If there is a day that you missed, just press this button under to select the day archive machine.
<button id="button">Select day</button>
<h3 id="h2"></h3>
<p id="paragraph"></p>

<script>
let verse = []
verse.push("Romans 8:1")
verse.push("Acts 3:19")
verse.push("John 3:16-17")
verse.push("Do not worry (Matthew 6:25-33)")
verse.push("Mark 13:33–37 — The Watchful Servants")

let list = []
list.push("There is therefore now no condemnation for those who are in Christ Jesus.")
list.push("Repent, then, and turn to God, so that your sins may be wiped out, that times of refreshing may come from the Lord")
list.push("For God so loved the world that he gave his one and only Son, that whoever believes in him shall not perish but have eternal life. For God did not send his Son into the world to condemn the world, but to save the world through him.")
list.push("Therefore I tell you, do not be anxious about your life, what you will eat or what you will drink, nor about your body, what you will put on. Is not life more than food, and the body more than clothing? Look at the birds of the air: they neither sow nor reap nor gather into barns, and yet your heavenly Father feeds them. Are you not of more value than they? And which of you by being anxious can add a single hour to his span of life? And why are you anxious about clothing? Consider the lilies of the field, how they grow: they neither toil nor spin, yet I tell you, even Solomon in all his glory was not arrayed like one of these. But if God so clothes the grass of the field, which today is alive and tomorrow is thrown into the oven, will he not much more clothe you, O you of little faith? Therefore do not be anxious, saying, ‘What shall we eat?’ or ‘What shall we drink?’ or ‘What shall we wear?’ For the Gentiles seek after all these things, and your heavenly Father knows that you need them all. But seek first the kingdom of God and his righteousness, and all these things will be added to you.")
list.push("Take ye heed, watch and pray, for ye know not when the time is. For the Son of man is as a man taking a far journey, who left his house, and gave authority to his servants, and to every man his work, and commanded the porter to watch. Watch ye therefore, for ye know not when the master of the house cometh, at even, or at midnight, or at the cockcrowing, or in the morning. Lest coming suddenly he find you sleeping. And what I say unto you I say unto all, Watch.")
        
let info = []
info.push(`What does being in Christ mean? <a href="https://www.bible.com/bible/111/2CO.5.17.NIV">Corinthians 5:17</a> says that after following Jesus we will be a new person.`)
info.push(`In more detail about repentance, check out this R3alism video: <a href="https://michael.team/yt/?yt=https://www.youtube.com/watch?v=wh-E0lV5pJs">click here</a>. This shows what repentance is really about, not just asking for forgiveness and not changing.`)
info.push(`We all know the famous John 3:16, but what about 17? John 3:17 is important to notice because it shows us that god didn't send his son to judge us, but to save us from judgement. Yes we will be judged, but Christ suffered on that cross, taking our punishment, because of our sins, we would have been crucified, but Christ did it for us. That's his gift and his invitation to accept him. Take that gift, unwrap it, open it up today. And accept him. I like how this connects to <a href="https://www.bible.com/bible/111/ROM.8.1.NIV">Romans 8:1</a>, my favorite verse, "There is therefore now no condemnation for those who are in Christ Jesus".`)
info.push(`Check out <a href="https://www.youtube.com/watch?v=EkRc4_uB7GA">this video</a> about anxiety and the lord leading you to your choices.`)
info.push(`You need to be ready for when the lord arrives. Follow what he says. The most important is love. Love, love the Lord and the people around you. Next is faith, trust the lord and belive in him. Works are dead without faith, but maybe you don't have enough faith if you don't do works. If you don't help others, if you don't study the bible, if you don't spread the gospel, then that might be signs that you faith in not strong. But this does not mean automaticly that you aren't saved.`)
  
let h2 = document.getElementById("h2")
let paragraph = document.getElementById("paragraph")

let day = list.length
let button = document.getElementById("button")

let something = document.createElement("div")
document.body.appendChild(something)

function showDay() {
  h2.textContent = verse[day-1]
  paragraph.textContent = list[day-1]
  something.innerHTML = info[day-1]
}

showDay()

button.onclick = function() {
  let selectedDay = Number(prompt("Select a day 1-" + list.length))

  if (selectedDay >= 1 &&
      selectedDay <= list.length &&
      Number.isInteger(selectedDay)) {
    day = selectedDay
    showDay()
  }
}
</script>
