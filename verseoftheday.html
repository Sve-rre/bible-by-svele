<title>Verse of the day</title>
<h1>Verse of the day</h1>
<h3 id="h2"></h3>
<p id="paragraph"></p>
What does being in christ mean? <a href="https://www.bible.com/bible/111/2CO.5.17.NIV">Corinthians 5:17</a> tells us about it.<br>
<button id="button">Select day</button>
<script>

let verse = []
verse.push("Romans 8:1")

let list = []
list.push("There is therefore now no condemnation for those who are in Christ Jesus.")

let h2 = document.getElementById("h2")
let paragraph = document.getElementById("paragraph")
h2.textContent = verse[verse.length-1]
paragraph.textContent = list[list.length-1]

let day = list.length
let button = document.getElementById("button")
button.onclick = function(){
  day = prompt("Select a day 1-"+ list.length)
  h2.textContent = verse[day-1]
  paragraph.textContent = list[day-1]
}
  
</script>
